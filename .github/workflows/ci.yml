name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  ci:
    uses: divmora/.github/.github/workflows/node-ci.yml@main
    with:
      package-manager: 'pnpm'
      node-version: '26'
      test-command: 'pnpm typecheck'
      build-command: 'pnpm build'
      enable-build: true
