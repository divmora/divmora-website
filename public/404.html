<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>DIVMORA Technologies</title>
    <script>
      // Single Page Apps fallback redirect for GitHub Pages
      var path = window.location.pathname.replace(/^\/+|\/+$/g, '');
      if (path === 'privacy' || path === 'privacy-policy') {
        window.location.replace('/#/privacy');
      } else if (path === 'terms' || path === 'terms-of-service' || path === 'terms-of-use') {
        window.location.replace('/#/terms');
      } else if (path === 'security' || path === 'security-policy' || path === 'vulnerability-disclosure') {
        window.location.replace('/#/security');
      } else {
        window.location.replace('/');
      }
    </script>
  </head>
  <body>
  </body>
</html>
